<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Harbour</title>
<style>
  html, body { margin: 0; height: 100%; background: #050814; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Every animated quantity is a function of phase = t / LOOP (0..1).
// Periodic motion uses sin/cos(2*PI*k*phase) with integer k, and travel uses
// (x0 + k*phase) mod 1 with integer k, so frame(t) === frame(t + 60).
const LOOP = 60;
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Deterministic pseudo-random so the scene is identical every load.
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
const R = rng(42);
const stars = Array.from({ length: 220 }, () => ({
  x: R(), y: R() * 0.55, r: 0.4 + R() * 1.2, k: 1 + Math.floor(R() * 6), p: R() * TAU
}));
const buildings = [];
{ let x = 0; while (x < 1) { const w = 0.025 + R() * 0.05; buildings.push({ x, w, h: 0.04 + R() * 0.12, seed: Math.floor(R() * 1e6) }); x += w; } }

function frac(v) { return v - Math.floor(v); }
function wave(phase, k, off = 0) { return Math.sin(TAU * (k * phase) + off); }

function drawSky(phase, horizon) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#02040d'); g.addColorStop(0.6, '#0b1433'); g.addColorStop(1, '#1d2a55');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon);
  for (const s of stars) {
    const a = 0.45 + 0.55 * (0.5 + 0.5 * wave(phase, s.k, s.p));
    ctx.fillStyle = `rgba(255,255,240,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
  }
}

function moonPos(phase, horizon) {
  // Gentle bob so it loops; no net travel.
  return { x: W * 0.78, y: horizon * 0.28 + 6 * wave(phase, 1), r: Math.max(18, Math.min(W, H) * 0.045) };
}

function drawMoon(m) {
  const glow = ctx.createRadialGradient(m.x, m.y, m.r * 0.5, m.x, m.y, m.r * 5);
  glow.addColorStop(0, 'rgba(255,245,210,0.35)'); glow.addColorStop(1, 'rgba(255,245,210,0)');
  ctx.fillStyle = glow; ctx.fillRect(m.x - m.r * 5, m.y - m.r * 5, m.r * 10, m.r * 10);
  ctx.fillStyle = '#f6efd2'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(200,190,160,0.35)';
  [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.12], [-0.05, 0.35, 0.1]].forEach(([dx, dy, rr]) => {
    ctx.beginPath(); ctx.arc(m.x + dx * m.r, m.y + dy * m.r, rr * m.r, 0, TAU); ctx.fill();
  });
}

function drawClouds(phase, horizon) {
  // Two cloud bands drifting 1 and 2 screen-widths per loop.
  [[1, 0.18, 0.10], [2, 0.32, 0.07]].forEach(([k, yy, alpha], i) => {
    for (let j = 0; j < 3; j++) {
      const x = (frac([0, 0.29, 0.61][j] + k * phase + i * 0.17) * 1.4 - 0.2) * W;
      const y = horizon * yy + j * 8;
      ctx.fillStyle = `rgba(150,165,210,${alpha})`;
      for (let b = 0; b < 5; b++) {
        ctx.beginPath(); ctx.ellipse(x + b * 28, y + Math.sin(b) * 6, 46, 12, 0, 0, TAU); ctx.fill();
      }
    }
  });
}

function drawCity(phase, horizon) {
  for (const b of buildings) {
    const x = b.x * W, w = b.w * W, h = b.h * H, y = horizon - h;
    ctx.fillStyle = '#0a0f22'; ctx.fillRect(x, y, w + 1, h);
    const r = rng(b.seed);
    for (let wy = y + 6; wy < horizon - 6; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7) {
      const on = r(); const k = 1 + Math.floor(r() * 3);
      if (on < 0.28) {
        // A few windows switch on/off an integer number of times per loop.
        const lit = on < 0.22 || wave(phase, k, on * 50) > 0;
        if (lit) { ctx.fillStyle = 'rgba(255,205,120,0.85)'; ctx.fillRect(wx, wy, 3, 4); }
      }
    }
  }
}

function drawLighthouse(phase, horizon) {
  const bx = W * 0.12, base = horizon + 4, top = horizon - H * 0.2, bw = 26;
  // Rotating beam: 5 full turns per loop (12 s each).
  const ang = TAU * 5 * phase;
  const sweep = Math.cos(ang);         // -1..1 left/right
  const facing = Math.sin(ang);        // >0 = toward viewer
  const len = W * 1.1;
  const spread = 0.07;
  const dir = sweep >= 0 ? 0 : Math.PI;
  const strength = 0.12 + 0.25 * Math.max(0, facing) + 0.1 * Math.abs(sweep);
  const lx = bx, ly = top - 10;
  const beam = ctx.createRadialGradient(lx, ly, 0, lx, ly, len * Math.max(0.15, Math.abs(sweep)));
  beam.addColorStop(0, `rgba(255,245,190,${strength.toFixed(3)})`); beam.addColorStop(1, 'rgba(255,245,190,0)');
  ctx.fillStyle = beam;
  ctx.beginPath(); ctx.moveTo(lx, ly);
  const L = len * Math.max(0.15, Math.abs(sweep));
  ctx.lineTo(lx + Math.cos(dir - spread) * L, ly + Math.sin(dir - spread) * L);
  ctx.lineTo(lx + Math.cos(dir + spread) * L, ly + Math.sin(dir + spread) * L);
  ctx.closePath(); ctx.fill();
  // Rock + tower
  ctx.fillStyle = '#06080f';
  ctx.beginPath(); ctx.ellipse(bx, base, 70, 16, 0, Math.PI, TAU); ctx.fill();
  ctx.fillStyle = '#d8d6cc';
  ctx.beginPath(); ctx.moveTo(bx - bw / 2, base - 4); ctx.lineTo(bx - bw / 3, top); ctx.lineTo(bx + bw / 3, top); ctx.lineTo(bx + bw / 2, base - 4); ctx.fill();
  ctx.fillStyle = '#a3262a';
  for (let i = 1; i < 4; i += 2) {
    const y0 = base - 4 - (base - 4 - top) * (i / 4), y1 = base - 4 - (base - 4 - top) * ((i + 1) / 4);
    const w0 = bw / 2 - (bw / 2 - bw / 3) * (i / 4), w1 = bw / 2 - (bw / 2 - bw / 3) * ((i + 1) / 4);
    ctx.beginPath(); ctx.moveTo(bx - w0, y0); ctx.lineTo(bx - w1, y1); ctx.lineTo(bx + w1, y1); ctx.lineTo(bx + w0, y0); ctx.fill();
  }
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(bx - 12, top - 20, 24, 20);
  ctx.fillStyle = `rgba(255,240,170,${(0.6 + 0.4 * Math.max(0, facing)).toFixed(3)})`; ctx.fillRect(bx - 9, top - 17, 18, 14);
  ctx.fillStyle = '#a3262a'; ctx.beginPath(); ctx.moveTo(bx - 14, top - 20); ctx.lineTo(bx, top - 32); ctx.lineTo(bx + 14, top - 20); ctx.fill();
}

function drawWater(phase, horizon, moon) {
  const g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, '#0f1a3a'); g.addColorStop(1, '#02050e');
  ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
  // Moon reflection: shimmering horizontal dashes.
  for (let i = 0; i < 40; i++) {
    const y = horizon + 4 + i * ((H - horizon) / 40);
    const wob = 10 * wave(phase, 5, i * 0.7) + 6 * wave(phase, 3, i * 1.3);
    const w = (30 + 40 * (0.5 + 0.5 * wave(phase, 4, i))) * (1 + i / 30);
    ctx.fillStyle = `rgba(255,240,200,${(0.35 - i * 0.006).toFixed(3)})`;
    ctx.fillRect(moon.x - w / 2 + wob, y, w, 2);
  }
  // City light reflections.
  for (const b of buildings) {
    if (b.h < 0.08) continue;
    const x = (b.x + b.w / 2) * W;
    for (let i = 0; i < 6; i++) {
      const y = horizon + 6 + i * 10;
      ctx.fillStyle = 'rgba(255,200,120,0.12)';
      ctx.fillRect(x - 3 + 3 * wave(phase, 7, b.x * 40 + i), y, 6, 2);
    }
  }
  // Wave lines scrolling 3 screen-widths per loop.
  ctx.strokeStyle = 'rgba(140,170,230,0.12)'; ctx.lineWidth = 1;
  for (let row = 0; row < 14; row++) {
    const y = horizon + 10 + row * row * ((H - horizon) / 200);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const yy = y + (2 + row * 0.4) * Math.sin(TAU * (x / W * (6 - row * 0.2) * 1) + TAU * 3 * phase * (row % 2 ? 1 : -1));
      x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
}

function drawBoat(x, y, s, rock, flip, lamp) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rock); ctx.scale(flip * s, s);
  ctx.fillStyle = '#0c0d14';
  ctx.beginPath(); ctx.moveTo(-40, -6); ctx.lineTo(40, -6); ctx.lineTo(30, 8); ctx.lineTo(-32, 8); ctx.closePath(); ctx.fill();
  ctx.fillRect(-8, -20, 22, 14);
  ctx.fillStyle = 'rgba(255,210,130,0.9)'; ctx.fillRect(-4, -16, 5, 5); ctx.fillRect(4, -16, 5, 5);
  ctx.strokeStyle = '#0c0d14'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-20, -48); ctx.stroke();
  ctx.fillStyle = `rgba(255,80,60,${lamp.toFixed(3)})`; ctx.beginPath(); ctx.arc(-20, -50, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBoats(phase, horizon) {
  // Moored boat bobbing in place.
  const mx = W * 0.55, my = horizon + (H - horizon) * 0.45;
  drawBoat(mx, my + 3 * wave(phase, 8), 1.2, 0.04 * wave(phase, 6, 1), 1, 0.5 + 0.5 * (wave(phase, 30) > 0 ? 1 : 0));
  // Boat crossing the harbour once per loop, wrapping off-screen.
  const u = frac(phase + 0.15);
  const cx = -100 + u * (W + 200), cy = horizon + (H - horizon) * 0.22;
  drawBoat(cx, cy + 2 * wave(phase, 10), 0.7, 0.03 * wave(phase, 9), -1, 0.9);
  // Light wake behind it
  ctx.fillStyle = 'rgba(200,220,255,0.15)';
  ctx.beginPath(); ctx.ellipse(cx - 40, cy + 6, 30, 2, 0, 0, TAU); ctx.fill();
}

function drawPier(phase, horizon) {
  const y = horizon + (H - horizon) * 0.62;
  ctx.fillStyle = '#05060b';
  ctx.fillRect(W * 0.62, y, W * 0.38, 10);
  for (let x = W * 0.64; x < W; x += 40) ctx.fillRect(x, y, 6, H - y);
  // Lamp posts with flickerless glow pulsing 2x per loop.
  for (let i = 0; i < 3; i++) {
    const lx = W * (0.68 + i * 0.12);
    ctx.fillRect(lx - 2, y - 60, 4, 60);
    const a = 0.25 + 0.1 * wave(phase, 2, i);
    const gl = ctx.createRadialGradient(lx, y - 62, 0, lx, y - 62, 60);
    gl.addColorStop(0, `rgba(255,210,140,${a.toFixed(3)})`); gl.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.fillStyle = gl; ctx.fillRect(lx - 60, y - 122, 120, 120);
    ctx.fillStyle = '#ffdca0'; ctx.beginPath(); ctx.arc(lx, y - 62, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#05060b';
  }
}

function render(t) {
  const phase = frac(t / LOOP);
  const horizon = H * 0.6;
  ctx.clearRect(0, 0, W, H);
  drawSky(phase, horizon);
  const moon = moonPos(phase, horizon);
  drawMoon(moon);
  drawClouds(phase, horizon);
  drawCity(phase, horizon);
  drawWater(phase, horizon, moon);
  drawLighthouse(phase, horizon);
  drawBoats(phase, horizon);
  drawPier(phase, horizon);
}

// Expose for testing: render any time instantly, e.g. renderAt(20).
window.renderAt = (t) => { render(t); };
const params = new URLSearchParams(location.search);
const fixed = params.has('t') ? parseFloat(params.get('t')) : null;
function loop(now) { render(fixed !== null ? fixed : now / 1000); if (fixed === null) requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
