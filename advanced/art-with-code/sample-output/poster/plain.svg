<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="0.55" stop-color="#6b1f6e"/>
      <stop offset="0.85" stop-color="#e8505b"/>
      <stop offset="1" stop-color="#f9a65a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.7" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#ff7b54"/>
    </radialGradient>
    <clipPath id="sunClip"><circle cx="200" cy="330" r="110"/></clipPath>
  </defs>

  <rect width="400" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="40" cy="40" r="1.2"/><circle cx="90" cy="110" r="0.9"/><circle cx="150" cy="60" r="1.4"/>
    <circle cx="260" cy="35" r="1"/><circle cx="330" cy="90" r="1.3"/><circle cx="370" cy="40" r="0.8"/>
    <circle cx="60" cy="190" r="1"/><circle cx="350" cy="180" r="1.1"/><circle cx="220" cy="120" r="0.8"/>
  </g>

  <!-- striped sun -->
  <g clip-path="url(#sunClip)">
    <circle cx="200" cy="330" r="110" fill="url(#sun)"/>
    <g fill="#6b1f6e">
      <rect x="80" y="352" width="240" height="5"/>
      <rect x="80" y="370" width="240" height="8"/>
      <rect x="80" y="392" width="240" height="11"/>
      <rect x="80" y="418" width="240" height="14"/>
    </g>
  </g>

  <!-- equalizer bars across sun -->
  <g fill="#1a0b3d" opacity="0.85">
    <rect x="118" y="400" width="10" height="40"/>
    <rect x="134" y="380" width="10" height="60"/>
    <rect x="150" y="360" width="10" height="80"/>
    <rect x="166" y="335" width="10" height="105"/>
    <rect x="182" y="350" width="10" height="90"/>
    <rect x="198" y="320" width="10" height="120"/>
    <rect x="214" y="345" width="10" height="95"/>
    <rect x="230" y="330" width="10" height="110"/>
    <rect x="246" y="365" width="10" height="75"/>
    <rect x="262" y="385" width="10" height="55"/>
    <rect x="278" y="405" width="10" height="35"/>
  </g>

  <!-- hills / crowd silhouette -->
  <path d="M0 440 Q60 415 120 438 T240 432 T400 425 L400 600 L0 600 Z" fill="#1a0b3d"/>
  <g fill="#1a0b3d">
    <circle cx="60" cy="425" r="9"/><circle cx="95" cy="428" r="8"/><circle cx="150" cy="424" r="9"/>
    <circle cx="250" cy="422" r="8"/><circle cx="300" cy="418" r="9"/><circle cx="345" cy="420" r="8"/>
    <path d="M140 430 L130 395 L136 393 L148 425 Z"/>
    <path d="M308 415 L318 382 L324 384 L314 418 Z"/>
  </g>

  <!-- title -->
  <text x="200" y="88" text-anchor="middle" font-family="Impact, 'Arial Black', Helvetica, sans-serif" font-size="22" letter-spacing="8" fill="#ffc857">SUMMER OF SOUND</text>
  <text x="200" y="160" text-anchor="middle" font-family="Impact, 'Arial Black', Helvetica, sans-serif" font-size="66" font-weight="900" fill="#fff3b0" letter-spacing="2">SOLSTICE</text>
  <text x="200" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="10" fill="#f9a65a">FESTIVAL 2027</text>

  <!-- lineup -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="200" y="478" font-size="20" font-weight="700" fill="#fff3b0" letter-spacing="2">NEON TIDES · VELVET ECHO</text>
    <text x="200" y="503" font-size="14" fill="#f9a65a" letter-spacing="2">THE MIDNIGHT ORCHARD · LUNA PARADE</text>
    <text x="200" y="523" font-size="12" fill="#e8c6e0" letter-spacing="2">GOLDEN HOUR · KITE SEASON · DUSTWAVE</text>
  </g>

  <line x1="60" y1="545" x2="340" y2="545" stroke="#ffc857" stroke-width="1" opacity="0.6"/>
  <text x="200" y="572" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffc857" letter-spacing="3">JUNE 18–20 · RIVERSIDE FIELDS</text>
</svg>
